# 通过 GitHub Actions 构建并部署 Jekyll 站点到 GitHub Pages
#
# 使用自有 Ruby 环境执行 bundle exec jekyll build，
# 使 _plugins/ 下的自定义插件（escape_code_liquid.rb 等）在线上构建中生效，
# 保证线上渲染结果与本地 bundle exec jekyll serve 一致。
#
# 前置条件：仓库 Settings → Pages → Source 需切换为 "GitHub Actions"。
name: Deploy Jekyll site to Pages

on:
  # master 分支有推送时自动触发，也允许手动运行
  push:
    branches: [master]
  workflow_dispatch:

# 设置 GITHUB_TOKEN 权限以允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 只允许同时进行一次部署，跳过正在排队和进行中的运行
# 但不要取消正在进行的运行，因为我们希望这些生产部署能够完成
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 与 GitHub Pages 线上环境保持一致（Disqus 等依赖 production 环境判断）
      JEKYLL_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Ruby >= 4.0：Gemfile 走显式依赖分支（jekyll + minima + liquid 等），
      # 不使用 github-pages 聚合 gem（它会强制 safe 模式与插件白名单，禁用 _plugins）
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true  # 自动执行 bundle install 并缓存 gem 依赖

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
